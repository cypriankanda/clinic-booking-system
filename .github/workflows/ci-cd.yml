name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace this step with your provider's deploy action/CLI.
      # Render / Fly.io / Railway all support a "deploy hook" URL or CLI
      # token stored as a GitHub secret -- no provider-specific code needs
      # to live in this repo.
      - name: Trigger deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

      # If your provider doesn't run migrations automatically on deploy,
      # add a step here to run them against the production DB, e.g.:
      #   - name: Run migrations
      #     env:
      #       DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      #     run: alembic upgrade head
