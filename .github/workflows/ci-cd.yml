name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint + tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: pytest -q

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  deploy:
    name: Deploy backend
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provider-agnostic: Railway / Render / Fly.io all expose a deploy hook
      # URL. It lives in the DEPLOY_HOOK_URL repository secret, so no
      # provider-specific credentials or config sit in this repo.
      - name: Trigger deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"

      # Railway runs `alembic upgrade head` as part of the release command.
      # If your provider doesn't, uncomment and set PROD_DATABASE_URL:
      #   - name: Run migrations
      #     env:
      #       DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      #     run: cd backend && pip install -r requirements.txt && alembic upgrade head
